# highlander.lab980.com — Highlander Auditorium (static site)
# Repo:   github.com/ivjames/highlander
# Docroot: /var/www/highlander  (the repo checkout; index.html + assets/)
# Install: see deploy/README.md

# --- HTTP: ACME challenge + redirect everything to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name highlander.lab980.com;

    # Let's Encrypt http-01 challenge (harmless if you use DNS/wildcard certs)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/highlander;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: serve the static site ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name highlander.lab980.com;

    root /var/www/highlander;
    index index.html;

    # === TLS ===================================================
    # ASSUMPTION: shared wildcard *.lab980.com cert. If lab980 issues
    # per-host certs via certbot instead, swap these two paths for
    # /etc/letsencrypt/live/highlander.lab980.com/{fullchain,privkey}.pem
    ssl_certificate     /etc/letsencrypt/live/lab980.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lab980.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # ===========================================================

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # Compression (assets are already-compressed woff2/jpg/png; this covers html/css/js/svg)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    # Static serving — no SPA fallback needed (single real page)
    location / {
        try_files $uri $uri/ =404;
    }

    # Hashed/immutable assets: fonts + imagery are self-hosted and stable
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The page itself must stay fresh so content edits show up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The docroot is a live git checkout — never expose repo internals.
    location ~ /\.(?!well-known) { deny all; }   # .git, dotfiles
    location ~* \.md$           { deny all; }     # HANDOFF.md, README.md
    location ^~ /deploy/        { deny all; }     # this config, deploy docs

    # Quiet favicon/robots noise
    location = /favicon.ico { try_files /assets/img/favicon.jpg =404; access_log off; log_not_found off; }
}
